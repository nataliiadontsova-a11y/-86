<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Insights</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070c; --bg2:#12121c; --card:#171724; --line:#2a2a3c;
  --gold:#f5c451; --gold2:#ffdf8a; --text:#f3f1ea; --muted:#9a98a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 20% 0%,rgba(245,196,81,.12),transparent 50%),
             radial-gradient(ellipse at 80% 100%,rgba(90,80,255,.12),transparent 55%);z-index:0}
section{position:relative;z-index:1;min-height:100vh;padding:64px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1,h2{font-family:"Bebas Neue",sans-serif;letter-spacing:2px;font-weight:400;text-align:center}
h1{font-size:clamp(44px,8vw,88px);line-height:1;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#b8862a);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(36px,6vw,60px);color:var(--gold)}
.sub{color:var(--muted);margin:12px 0 40px;text-align:center;font-size:16px}
.step{display:inline-block;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);border:1px solid rgba(245,196,81,.4);padding:6px 14px;border-radius:999px;margin-bottom:18px}

/* Studios grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;width:100%;max-width:1040px}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
.studio{position:relative;cursor:pointer;border-radius:16px;overflow:hidden;background:var(--card);border:2px solid var(--line);aspect-ratio:16/10;transition:transform .25s,border-color .25s,box-shadow .25s}
.studio img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.studio.contain img{object-fit:contain;background:#fff}
.studio:hover{transform:translateY(-4px);border-color:rgba(245,196,81,.6)}
.studio:hover img{transform:scale(1.05)}
.studio .name{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 10px;font-weight:600;font-size:14px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.studio.selected{border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,196,81,.25),0 12px 40px rgba(245,196,81,.25)}
.studio .check{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#111;display:grid;place-items:center;font-weight:700;transform:scale(0);transition:transform .25s}
.studio.selected .check{transform:scale(1)}

/* Form */
#form{display:none}
#form.show{display:flex}
.panel{width:100%;max-width:520px;background:linear-gradient(180deg,#191927,#11111a);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.chosen{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.chosen img{width:72px;height:44px;object-fit:cover;border-radius:8px;background:#fff}
.chosen small{color:var(--muted);display:block;font-size:12px}
.chosen b{font-size:15px}
.chosen button{margin-left:auto;background:none;border:none;color:var(--gold);cursor:pointer;font:inherit;font-size:13px}
label{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.dd{position:relative}
.dd-btn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:12px;border:1px solid var(--gold);background:rgba(245,196,81,.08);color:var(--text);font:600 16px Inter,sans-serif;cursor:pointer;transition:background .2s}
.dd-btn:hover{background:rgba(245,196,81,.15)}
.dd-btn .arrow{transition:transform .25s;color:var(--gold)}
.dd.open .arrow{transform:rotate(180deg)}
.dd-list{list-style:none;position:absolute;left:0;right:0;top:calc(100% + 8px);background:#1d1d2c;border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:5;max-height:0;opacity:0;transition:max-height .3s,opacity .25s;pointer-events:none}
.dd.open .dd-list{max-height:300px;opacity:1;pointer-events:auto}
.dd-list li{padding:14px 18px;cursor:pointer;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.dd-list li:last-child{border-bottom:none}
.dd-list li:hover,.dd-list li.active{background:rgba(245,196,81,.14);color:var(--gold2)}
.field{position:relative}
.field input{width:100%;padding:15px 18px;border-radius:12px;border:1px solid var(--line);background:#0e0e16;color:var(--text);font:500 16px Inter,sans-serif;outline:none;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field input.typing{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,196,81,.2)}
.field input.done{border-color:#4ade80}
.field .ok{position:absolute;right:14px;top:50%;transform:translateY(-50%) scale(0);color:#4ade80;font-weight:700;transition:transform .2s}
.field input.done + .ok{transform:translateY(-50%) scale(1)}
.hint{color:var(--muted);font-size:12px;margin-top:14px;text-align:center}
#insights{display:block;width:100%;margin-top:26px;padding:18px;border:none;border-radius:14px;font:400 26px "Bebas Neue",sans-serif;letter-spacing:3px;color:#1a1305;cursor:pointer;
  background:linear-gradient(135deg,var(--gold2),var(--gold) 50%,#d99a2b);box-shadow:0 10px 30px rgba(245,196,81,.35);
  display:none}
#insights.show{display:block;animation:appear .5s ease both,pulse 2s infinite .5s}
@keyframes appear{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 10px 30px rgba(245,196,81,.35)}50%{box-shadow:0 10px 50px rgba(245,196,81,.7)}}

/* Show overlay */
#show{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 40%,#8f86c9 0%,#5d538f 35%,#342c5a 70%,#211b3a 100%);display:none;align-items:center;justify-content:center;flex-direction:column}
#show.on{display:flex}
#fw{position:absolute;inset:0;width:100%;height:100%}
.clap{position:relative;width:min(440px,88vw);z-index:2;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes snap{to{transform:rotate(0)}}
.clap svg{display:block;width:100%;height:auto;overflow:visible}
.clap .arm{transform-origin:27px 70px;transform:rotate(-30deg)}
.clap.snap .arm{animation:snap .35s cubic-bezier(.6,0,1,1) .5s forwards}
.clap.shake svg{animation:shake .3s ease .85s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateY(4px)}50%{transform:translateY(-3px)}75%{transform:translateY(2px)}}
.action{position:relative;z-index:2;margin-top:18px;font:400 clamp(40px,9vw,72px) "Bebas Neue",sans-serif;letter-spacing:4px;color:var(--gold);text-shadow:0 2px 0 #7a4e08,0 0 30px rgba(245,196,81,.7),0 6px 20px rgba(0,0,0,.4);opacity:0}
.action.in{animation:actin .6s ease forwards}
@keyframes actin{from{opacity:0;transform:scale(2)}to{opacity:1;transform:none}}
.beams{position:absolute;inset:-15%;pointer-events:none;background:conic-gradient(from 200deg at 50% 110%,transparent 0 8deg,rgba(255,240,200,.18) 10deg 14deg,transparent 16deg 30deg,rgba(255,240,200,.14) 32deg 36deg,transparent 38deg 52deg,rgba(255,240,200,.18) 54deg 58deg,transparent 60deg 74deg,rgba(255,240,200,.12) 76deg 80deg,transparent 82deg);animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(3deg)}}
.close{position:absolute;top:18px;right:18px;z-index:3;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer}
.again{position:relative;z-index:2;margin-top:20px;background:none;border:1px solid var(--gold);color:var(--gold);padding:10px 22px;border-radius:999px;cursor:pointer;font:600 14px Inter,sans-serif;opacity:0;transition:opacity .4s}
.again.in{opacity:1}
</style>
</head>
<body>

<section id="studios">
  <span class="step">Step 1</span>
  <h1>Choose your studio</h1>
  <p class="sub">Tap the studio you want to work with</p>
  <div class="grid" id="grid"></div>
</section>

<section id="form">
  <span class="step">Step 2</span>
  <h2>Project details</h2>
  <p class="sub">Choose the production type and fill in your contacts</p>
  <div class="panel">
    <div class="chosen">
      <img id="chosenImg" alt="">
      <div><small>Selected studio</small></div>
      <button id="change">Change</button>
    </div>

    <label>Production</label>
    <div class="dd" id="dd">
      <button class="dd-btn" id="ddBtn" type="button"><span id="ddLabel">Production</span><span class="arrow">▼</span></button>
      <ul class="dd-list">
        <li data-v="Film">🎬 Film</li>
        <li data-v="Series">📺 Series</li>
        <li data-v="TV show">🎤 TV show</li>
        <li data-v="Clip">🎵 Clip</li>
      </ul>
    </div>

    <label for="name">Name</label>
    <div class="field"><input id="name" readonly placeholder="Tap to fill in" data-val="Mark I"><span class="ok">✓</span></div>
    <label for="phone">Phone</label>
    <div class="field"><input id="phone" readonly placeholder="Tap to fill in" data-val="012345678"><span class="ok">✓</span></div>
    <label for="email">Email</label>
    <div class="field"><input id="email" readonly placeholder="Tap to fill in" data-val="mymail@mail.com"><span class="ok">✓</span></div>

    <button id="insights" type="button">Get insights</button>
  </div>
</section>

<div id="show">
  <div class="beams"></div><canvas id="fw"></canvas>
  <button class="close" id="close" aria-label="Close">✕</button>
  <div class="clap" id="clap">
  <svg viewBox="0 0 420 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clapperboard">
    <defs>
      <pattern id="stA" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="skewX(-38)">
        <rect width="60" height="60" fill="#15161b"/><rect width="30" height="60" fill="#f4f1ea"/>
      </pattern>
      <pattern id="stB" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="skewX(38)">
        <rect width="60" height="60" fill="#15161b"/><rect x="30" width="30" height="60" fill="#f4f1ea"/>
      </pattern>
      <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".45" stop-color="#fff" stop-opacity=".05"/>
        <stop offset=".55" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".35"/>
      </linearGradient>
      <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2c2f37"/><stop offset=".5" stop-color="#1c1e24"/><stop offset="1" stop-color="#121318"/>
      </linearGradient>
      <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a4d57"/><stop offset="1" stop-color="#1a1b20"/>
      </linearGradient>
      <radialGradient id="metal" cx=".35" cy=".3" r=".8">
        <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#d4d7de"/><stop offset=".75" stop-color="#7c818c"/><stop offset="1" stop-color="#3d4048"/>
      </radialGradient>
      <radialGradient id="gold" cx=".35" cy=".3" r=".8">
        <stop offset="0" stop-color="#fff3c4"/><stop offset=".4" stop-color="#f5c451"/><stop offset="1" stop-color="#8a5d12"/>
      </radialGradient>
      <filter id="chalk" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="2" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
      </filter>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
      </filter>
      <g id="screw"><circle r="7" fill="url(#metal)" stroke="#2a2c33" stroke-width="1.2"/><path d="M-4 -4 L4 4 M-4 4 L4 -4" stroke="#3a3d45" stroke-width="1.6" stroke-linecap="round"/></g>
    </defs>

    <g filter="url(#shadow)">
      <!-- BODY -->
      <rect x="16" y="112" width="388" height="256" rx="16" fill="url(#frame)"/>
      <rect x="24" y="118" width="372" height="242" rx="11" fill="url(#slate)"/>
      <rect x="24" y="118" width="372" height="242" rx="11" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="2"/>
      <use href="#screw" x="38" y="346"/><use href="#screw" x="382" y="346"/>

      <g filter="url(#chalk)" fill="none" stroke="#e9e5d8" stroke-width="2" stroke-linecap="round" opacity=".92">
        <line x1="40" y1="170" x2="380" y2="170"/>
        <line x1="40" y1="232" x2="380" y2="232"/>
        <line x1="40" y1="282" x2="380" y2="282"/>
        <line x1="153" y1="170" x2="153" y2="232"/><line x1="266" y1="170" x2="266" y2="232"/>
        <line x1="210" y1="282" x2="210" y2="332"/>
      </g>
      <g font-family="Inter,Arial,sans-serif" font-weight="700" fill="#a9a7a0" font-size="11" letter-spacing="2">
        <text x="40" y="135">PRODUCTION</text>
        <text x="48" y="186">ROLL</text><text x="161" y="186">SCENE</text><text x="274" y="186">TAKE</text>
        <text x="40" y="248">DIRECTOR</text>
        <text x="40" y="298">CAMERA</text><text x="218" y="298">DATE</text>
      </g>
      <g font-family="'Permanent Marker','Comic Sans MS',cursive" fill="#f6f2e4" filter="url(#chalk)">
        <text id="cProd" x="40" y="160" font-size="24">Film</text>
        <text x="96" y="222" font-size="28" text-anchor="middle">A001</text>
        <text x="210" y="222" font-size="30" text-anchor="middle">1</text>
        <text x="323" y="222" font-size="30" text-anchor="middle">1</text>
        <text id="cName" x="130" y="268" font-size="24">Mark I</text>
        <text x="110" y="322" font-size="22">A-CAM</text>
        <text id="cDate" x="262" y="322" font-size="20"></text>
      </g>
      <g font-family="Inter,Arial,sans-serif" font-weight="700" font-size="10" fill="#a9a7a0" letter-spacing="1.5">
        <rect x="272" y="128" width="11" height="11" rx="2" fill="none" stroke="#a9a7a0" stroke-width="1.5"/><text x="288" y="137">INT</text>
        <rect x="318" y="128" width="11" height="11" rx="2" fill="#f5c451" stroke="#f5c451" stroke-width="1.5"/><text x="334" y="137">EXT</text>
        <rect x="272" y="146" width="11" height="11" rx="2" fill="#f5c451" stroke="#f5c451" stroke-width="1.5"/><text x="288" y="155">DAY</text>
        <rect x="318" y="146" width="11" height="11" rx="2" fill="none" stroke="#a9a7a0" stroke-width="1.5"/><text x="334" y="155">NIGHT</text>
      </g>

      <!-- LOWER STICK -->
      <rect x="16" y="72" width="388" height="42" rx="5" fill="url(#stB)"/>
      <rect x="16" y="72" width="388" height="42" rx="5" fill="url(#gloss)"/>
      <rect x="16" y="72" width="388" height="42" rx="5" fill="none" stroke="#0b0b0e" stroke-width="3"/>
      <use href="#screw" x="390" y="93"/>

      <!-- TOP ARM -->
      <g class="arm">
        <rect x="16" y="26" width="388" height="42" rx="5" fill="url(#stA)"/>
        <rect x="16" y="26" width="388" height="42" rx="5" fill="url(#gloss)"/>
        <rect x="16" y="26" width="388" height="42" rx="5" fill="none" stroke="#0b0b0e" stroke-width="3"/>
        <use href="#screw" x="390" y="47"/>
      </g>

      <!-- HINGE -->
      <rect x="10" y="44" width="34" height="56" rx="8" fill="url(#frame)" stroke="#0b0b0e" stroke-width="2"/>
      <circle cx="27" cy="70" r="11" fill="url(#gold)" stroke="#5a3d08" stroke-width="1.5"/>
      <circle cx="27" cy="70" r="4" fill="#5a3d08"/>
      <use href="#screw" x="27" y="92" transform="scale(1)"/>
    </g>
  </svg>
  </div>
  <div class="action" id="action">Action!</div>
  <button class="again" id="again">Start over</button>
</div>

oAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigD//2Q==", "name": "Pixar Animation Studios", "short": "Pixar", "contain": true}];
const state = {studio:null, prod:null, filled:{}};
const $ = id => document.getElementById(id);

// Step 1
const grid = $('grid');
STUDIOS.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className = 'studio' + (s.contain ? ' contain' : '');
  d.innerHTML = `<img src="${s.img}" alt="${s.name}"><div class="check">✓</div>`;
  d.onclick = () => selectStudio(i, d);
  grid.appendChild(d);
});
function selectStudio(i, el){
  document.querySelectorAll('.studio').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
  state.studio = STUDIOS[i];
  $('chosenImg').src = state.studio.img;
  $('form').classList.add('show');
  setTimeout(()=>$('form').scrollIntoView({behavior:'smooth'}), 350);
}
$('change').onclick = () => $('studios').scrollIntoView({behavior:'smooth'});

// Dropdown
const dd = $('dd');
$('ddBtn').onclick = e => { e.stopPropagation(); dd.classList.toggle('open'); };
document.addEventListener('click', () => dd.classList.remove('open'));
dd.querySelectorAll('li').forEach(li => li.onclick = e => {
  e.stopPropagation();
  dd.querySelectorAll('li').forEach(x=>x.classList.remove('active'));
  li.classList.add('active');
  state.prod = li.dataset.v;
  $('ddLabel').textContent = li.textContent;
  dd.classList.remove('open');
  check();
});

// Auto-type fields
document.querySelectorAll('.field input').forEach(inp => {
  inp.addEventListener('click', () => typeInto(inp));
  inp.addEventListener('focus', () => typeInto(inp));
});
function typeInto(inp){
  if (inp.dataset.busy || inp.classList.contains('done')) return;
  inp.dataset.busy = 1;
  inp.classList.add('typing');
  const val = inp.dataset.val; let i = 0; inp.value = '';
  const t = setInterval(() => {
    inp.value = val.slice(0, ++i);
    if (i >= val.length){
      clearInterval(t);
      inp.classList.remove('typing'); inp.classList.add('done');
      state.filled[inp.id] = true;
      check();
    }
  }, 70);
}
function check(){
  const ok = ['name','phone','email'].every(k => state.filled[k]);
  const b = $('insights');
  if (ok && !b.classList.contains('show')) { b.classList.add('show'); setTimeout(()=>b.scrollIntoView({behavior:'smooth',block:'center'}),100); }
  if (!ok) b.classList.remove('show');
}

// Show
$('insights').onclick = startShow;
$('close').onclick = stopShow;
$('again').onclick = () => { stopShow(); reset(); };

function startShow(){
  $('cProd').textContent = state.prod || 'Film';
  $('cName').textContent = $('name').value;
  const d=new Date(); $('cDate').textContent = String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
  const clap = $('clap'), act = $('action'), again = $('again');
  [clap, act, again].forEach(x => x.classList.remove('snap','shake','in'));
  void clap.offsetWidth;
  $('show').classList.add('on');
  clap.style.animation = 'none'; void clap.offsetWidth; clap.style.animation = '';
  clap.classList.add('snap','shake');
  setTimeout(() => { clapSound(); act.classList.add('in'); fireworks.start(); }, 850);
  setTimeout(() => again.classList.add('in'), 2200);
}
function stopShow(){ $('show').classList.remove('on'); fireworks.stop(); }
function reset(){
  state.studio = null; state.prod = null; state.filled = {};
  document.querySelectorAll('.studio').forEach(x=>x.classList.remove('selected'));
  document.querySelectorAll('.field input').forEach(x=>{x.value='';x.className='';delete x.dataset.busy;});
  dd.querySelectorAll('li').forEach(x=>x.classList.remove('active'));
  $('ddLabel').textContent = 'Production';
  check();
  $('form').classList.remove('show');
  window.scrollTo({top:0, behavior:'smooth'});
}

function clapSound(){
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const len = ac.sampleRate*0.12, buf = ac.createBuffer(1,len,ac.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);
    const src = ac.createBufferSource(); src.buffer = buf;
    const g = ac.createGain(); g.gain.value = .6;
    src.connect(g).connect(ac.destination); src.start();
  }catch(e){}
}

// Fireworks
const fireworks = (() => {
  const c = $('fw'), ctx = c.getContext('2d');
  let parts = [], rockets = [], raf = null, timer = null, w, h;
  const colors = ['#f5c451','#ff4d6d','#4dd2ff','#7cff6b','#c77dff','#ffffff','#ff9f1c'];
  function size(){ w = c.width = innerWidth*devicePixelRatio; h = c.height = innerHeight*devicePixelRatio; }
  addEventListener('resize', size);
  function launch(){
    rockets.push({x:w*(.15+Math.random()*.7), y:h, vx:(Math.random()-.5)*2*devicePixelRatio,
      vy:-(h*.012+Math.random()*h*.006), ty:h*(.15+Math.random()*.35), col:colors[Math.random()*colors.length|0]});
  }
  function burst(r){
    const n = 70 + Math.random()*50|0;
    for(let i=0;i<n;i++){
      const a = Math.PI*2*i/n, sp = (2+Math.random()*4)*devicePixelRatio;
      parts.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col:Math.random()<.2?'#fff':r.col});
    }
  }
  function loop(){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(0,0,w,h);
    ctx.globalCompositeOperation = 'lighter';
    rockets = rockets.filter(r => {
      r.x += r.vx; r.y += r.vy; r.vy += .05*devicePixelRatio;
      ctx.fillStyle = r.col; ctx.beginPath(); ctx.arc(r.x,r.y,2.5*devicePixelRatio,0,7); ctx.fill();
      if (r.y <= r.ty || r.vy >= 0){ burst(r); return false; } return true;
    });
    parts = parts.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vx *= .97; p.vy = p.vy*.97 + .06*devicePixelRatio; p.life -= .012;
      ctx.globalAlpha = Math.max(p.life,0); ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,2*devicePixelRatio,0,7); ctx.fill();
      return p.life > 0;
    });
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(loop);
  }
  return {
    start(){ size(); parts=[]; rockets=[]; ctx.clearRect(0,0,w,h);
      for(let i=0;i<4;i++) setTimeout(launch, i*150);
      clearInterval(timer); timer = setInterval(()=>{ launch(); if(Math.random()<.5) launch(); }, 450);
      cancelAnimationFrame(raf); loop(); },
    stop(){ clearInterval(timer); cancelAnimationFrame(raf); ctx.clearRect(0,0,w,h); }
  };
})();
</script>
